          cat > $J/TrainSpawner.java <<'EOF'
          package com.railnuke;

          import com.simibubi.create.Create;
          import com.simibubi.create.content.trains.entity.Carriage;
          import com.simibubi.create.content.trains.entity.CarriageContraption;
          import com.simibubi.create.content.trains.entity.Train;
          import com.simibubi.create.content.trains.schedule.Schedule;
          import com.simibubi.create.content.trains.station.GlobalStation;
          import com.simibubi.create.content.trains.station.StationBlockEntity;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.nbt.ListTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.Rotation;
          import net.minecraft.world.level.levelgen.structure.BoundingBox;
          import net.minecraft.world.level.levelgen.structure.templatesystem.StructurePlaceSettings;
          import net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate;

          import java.util.List;
          import java.util.UUID;

          /** Places a schematic train on a station platform, assembles it, gives it a schedule and seats NPC conductors. */
          final class TrainSpawner {
              static final String[] NAMES = {"RailFan_Steve", "Alex", "Casey", "DieselDan", "MaggieMae", "SteamSally", "Jonesy", "TrackTom",
                      "Pixel_Pete", "ConductorKai", "Rory", "Zuri", "Ari", "Efe", "Noor", "Sunny", "Makena", "BigJoe", "Willow", "Ned", "Cleo", "Rusty", "Dot", "Gus"};

              private TrainSpawner() {}

              static void spawn(ServerLevel lv, Plan.Slot s, List<String> dests) {
                  BoundingBox box = null;
                  try {
                      Schematics.Info info = s.schem();
                      StructureTemplate t = new StructureTemplate();
                      t.load(lv.holderLookup(Registries.BLOCK), info.tag());
                      Direction ext = Config.ASSEMBLE_AHEAD.get() ? s.dir() : s.dir().getOpposite();
                      boolean extX = ext.getAxis() == Direction.Axis.X;
                      Rotation rot = info.axisX() == extX ? Rotation.NONE : Rotation.CLOCKWISE_90;
                      StructurePlaceSettings ps = new StructurePlaceSettings().setRotation(rot).setIgnoreEntities(true);

                      BlockPos anchor = BlockPos.ZERO;
                      int best = Integer.MAX_VALUE;
                      for (int[] b : info.bogeys()) {
                          BlockPos tp = StructureTemplate.calculateRelativePosition(ps, new BlockPos(b[0], b[1], b[2]));
                          int c = ext.getStepX() * tp.getX() + ext.getStepZ() * tp.getZ();
                          if (c < best) { best = c; anchor = tp; }
                      }
                      BlockPos org = s.track().above().subtract(anchor);
                      t.placeInWorld(lv, org, org, ps, lv.getRandom(), 3);
                      box = t.getBoundingBox(ps, org);

                      if (!(lv.getBlockEntity(s.station()) instanceof StationBlockEntity sbe)) { clean(lv, box, s); return; }
                      sbe.tryEnterAssemblyMode();
                      sbe.assemble(UUID.randomUUID());
                      GlobalStation gs = sbe.getStation();
                      Train train = gs == null ? null : gs.getPresentTrain();
                      if (train == null) { clean(lv, box, s); return; }

                      int n = train.carriages.size();
                      if (n < Config.MIN_CARRIAGES.get() || n > Config.MAX_CARRIAGES.get()) {
                          // no wagons attached (or too many) -> this train does not spawn
                          Create.RAILWAYS.removeTrain(train.id);
                          for (Carriage c : train.carriages) c.forEachPresentEntity(Entity::discard);
                          return;
                      }

                      train.name = Component.literal(s.kind().label + " Express " + s.name().substring(s.name().length() - 1));

                      // schedule: cyclic list of every station of this train's kind
                      ListTag entries = new ListTag();
                      for (String d : dests) {
                          CompoundTag e = new CompoundTag();
                          CompoundTag ins = new CompoundTag();
                          ins.putString("Id", "create:destination");
                          CompoundTag data = new CompoundTag();
                          data.putString("Text", d);
                          ins.put("Data", data);
                          e.put("Instruction", ins);
                          ListTag conds = new ListTag();
                          ListTag and = new ListTag();
                          CompoundTag c = new CompoundTag();
                          c.putString("Id", "create:delay");
                          CompoundTag cd = new CompoundTag();
                          cd.putInt("Value", 15);
                          cd.putInt("TimeUnit", 1);
                          c.put("Data", cd);
                          and.add(c);
                          conds.add(and);
                          e.put("Conditions", conds);
                          entries.add(e);
                      }
                      CompoundTag st = new CompoundTag();
                      st.put("Entries", entries);
                      st.putBoolean("Cyclic", true);
                      Schedule sch = Schedule.fromTag(lv.registryAccess(), st);
                      train.runtime.setSchedule(sch, false);

                      // NPC conductors on the conductor seats
                      for (Carriage c : train.carriages) {
                          c.forEachPresentEntity(cce -> {
                              if (!(cce.getContraption() instanceof CarriageContraption cc)) return;
                              for (BlockPos seat : cc.conductorSeats.keySet()) {
                                  int idx = cc.getSeats().indexOf(seat);
                                  if (idx < 0) continue;
                                  ConductorEntity ce = RailNuke.CONDUCTOR.get().create(lv);
                                  if (ce == null) continue;
                                  ce.setPos(cce.position());
                                  ce.setSkin(lv.random.nextInt(9));
                                  ce.setCustomName(Component.literal(NAMES[lv.random.nextInt(NAMES.length)]));
                                  ce.setCustomNameVisible(true);
                                  lv.addFreshEntity(ce);
                                  cce.addSittingPassenger(ce, idx);
                              }
                          });
                      }
                  } catch (Throwable e) {
                      Jobs.LOG.warn("Rail Nuke: train spawn failed at {}: {}", s.name(), e.toString());
                      if (box != null) clean(lv, box, s);
                  }
              }

              private static void clean(ServerLevel lv, BoundingBox box, Plan.Slot s) {
                  for (BlockPos p : BlockPos.betweenClosed(box.minX(), s.track().getY() + 1, box.minZ(), box.maxX(), box.maxY(), box.maxZ())) {
                      if (!lv.getBlockState(p).isAir()) lv.setBlock(p, Blocks.AIR.defaultBlockState(), 2 | 16);
                  }
              }
          }
          EOF

          cat > $J/Plan.java <<'EOF'
          package com.railnuke;

          import com.simibubi.create.AllBlocks;
          import com.simibubi.create.AllDataComponents;
          import com.simibubi.create.content.trains.station.StationBlockEntity;
          import com.simibubi.create.content.trains.track.BezierConnection;
          import com.simibubi.create.content.trains.track.TrackBlock;
          import com.simibubi.create.content.trains.track.TrackBlockEntity;
          import com.simibubi.create.content.trains.track.TrackShape;
          import net.createmod.catnip.data.Couple;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.Vec3;
          import net.neoforged.neoforge.common.util.FakePlayer;
          import net.neoforged.neoforge.common.util.FakePlayerFactory;

          import java.util.*;

          /**
           * One explosion = one Plan: a list of small build steps (tracks, curves, platforms, stations, signals, trains)
           * that Jobs executes a few per tick.
           */
          final class Plan {
              enum Kind {
                  PASSENGER("Passenger"), CARGO("Cargo"), FLUID("Fluid");
                  final String label;
                  Kind(String l) { label = l; }
              }

              record Step(Runnable run, int cost, int waitAfter) {}
              record Curve(BlockPos a, Direction aOut, BlockPos b, Direction bOut) {}
              record Side(BlockPos start, Direction dir, int len) {}
              record Sig(BlockPos track, Direction dir, Direction side) {}
              record Slot(BlockPos track, Direction dir, Direction side, Kind kind, String name, Schematics.Info schem) {
                  BlockPos station() { return track.relative(side, 3).above(); }
              }

              final ServerLevel level;
              final Deque<Step> steps = new ArrayDeque<>();
              int wait;

              private final int y, ox, oz;
              private final Map<BlockPos, Direction.Axis> tracks = new LinkedHashMap<>();
              private final Set<BlockPos> be = new HashSet<>();
              private final List<Curve> curves = new ArrayList<>();
              private final List<Slot> slots = new ArrayList<>();
              private final List<Sig> sigs = new ArrayList<>();
              private final List<Schematics.Info> pool;
              private final Map<Kind, Integer> counts = new EnumMap<>(Kind.class);
              private final RandomSource rnd = RandomSource.create();

              Plan(ServerLevel level, BlockPos o, int tier) {
                  this.level = level;
                  this.y = o.getY();
                  this.ox = o.getX();
                  this.oz = o.getZ();
                  this.pool = Config.SPAWN_TRAINS.get() ? Schematics.scan() : List.of();
                  switch (tier) {
                      case 1 -> tier1();
                      case 2 -> tier2();
                      default -> tier3();
                  }
                  finish();
              }

              // ------------------------------------------------------------------ layouts

              /** Type 1: toy-train oval, one station, exactly one AI train. */
              private void tier1() {
                  List<Side> s = ring(92, 56, 8);
                  slot(s.get(0), 62, null, true);
              }

              /** Type 2: regional network: ring + 2 branch loops (cargo, fluid) + 4 passenger stations + signals = 6 trains. */
              private void tier2() {
                  List<Side> s = ring(180, 110, 8);
                  loop(s.get(0), 4, Kind.CARGO);
                  slot(s.get(0), 152, Kind.PASSENGER, false);
                  slot(s.get(1), 64, Kind.PASSENGER, false);
                  loop(s.get(2), 4, Kind.FLUID);
                  slot(s.get(2), 152, Kind.PASSENGER, false);
                  slot(s.get(3), 64, Kind.PASSENGER, false);
                  for (Side sd : s) signal(sd);
              }

              /** Type 3: grand network: bigger ring, 6 branch loops, 4 main stations, signals = 10 trains. */
              private void tier3() {
                  List<Side> s = ring(300, 180, 10);
                  loop(s.get(0), 4, Kind.CARGO);
                  loop(s.get(0), 106, Kind.FLUID);
                  slot(s.get(0), 270, Kind.PASSENGER, false);
                  loop(s.get(1), 4, Kind.CARGO);
                  slot(s.get(1), 152, Kind.PASSENGER, false);
                  loop(s.get(2), 4, Kind.FLUID);
                  loop(s.get(2), 106, Kind.CARGO);
                  slot(s.get(2), 270, Kind.PASSENGER, false);
                  loop(s.get(3), 4, Kind.PASSENGER);
                  slot(s.get(3), 152, Kind.PASSENGER, false);
                  for (Side sd : s) signal(sd);
              }

              // ------------------------------------------------------------------ plan helpers

              private BlockPos at(int x, int z) { return new BlockPos(ox + x, y, oz + z); }

              private void straight(BlockPos from, Direction d, int n) {
                  for (int i = 0; i <= n; i++) tracks.putIfAbsent(from.relative(d, i), d.getAxis());
              }

              private void curve(BlockPos a, Direction aOut, BlockPos b, Direction bOut) {
                  tracks.putIfAbsent(a, aOut.getAxis());
                  tracks.putIfAbsent(b, bOut.getAxis());
                  be.add(a);
                  be.add(b);
                  curves.add(new Curve(a, aOut, b, bOut));
              }

              /** Clockwise rounded-rectangle loop with 90 degree spline corners. */
              private List<Side> ring(int w, int h, int r) {
                  Direction[] ds = {Direction.EAST, Direction.SOUTH, Direction.WEST, Direction.NORTH};
                  BlockPos s = at(-w / 2 + r, -h / 2);
                  List<Side> out = new ArrayList<>();
                  for (int i = 0; i < 4; i++) {
                      Direction d = ds[i], n = ds[(i + 1) % 4];
                      int len = (i % 2 == 0) ? w - 2 * r : h - 2 * r;
                      straight(s, d, len);
                      out.add(new Side(s, d, len));
                      BlockPos e = s.relative(d, len);
                      BlockPos nb = e.relative(d, r).relative(n, r);
                      curve(e, d, nb, n.getOpposite());
                      s = nb;
                  }
                  return out;
              }

              private Schematics.Info pick(Kind k) {
                  List<Schematics.Info> l = pool.stream().filter(i -> k == null || i.kind() == k).toList();
                  return l.isEmpty() ? null : l.get(rnd.nextInt(l.size()));
              }

              private String name(Kind k) {
                  int n = counts.merge(k, 1, Integer::sum);
                  return k.label + " " + (char) ('A' + n - 1);
              }

              /** Station on the main line (platform on the inner side, train spawns behind it). */
              private void slot(Side sd, int off, Kind k, boolean anyKind) {
                  Schematics.Info sc;
                  if (anyKind) {
                      sc = pick(null);
                      k = sc != null ? sc.kind() : Kind.PASSENGER;
                  } else {
                      sc = pick(k);
                  }
                  BlockPos tr = sd.start().relative(sd.dir(), off);
                  slots.add(new Slot(tr, sd.dir(), sd.dir().getClockWise(), k, name(k), sc));
              }

              /** Branch line: an S-curve switch off the main line, a parallel siding with a station, and an S-curve merge back. */
              private void loop(Side sd, int off, Kind k) {
                  Direction d = sd.dir(), s = d.getClockWise();
                  int L = 16, W = 6, SL = 64;
                  BlockPos p1 = sd.start().relative(d, off);
                  BlockPos q1 = p1.relative(d, L).relative(s, W);
                  BlockPos q2 = q1.relative(d, SL);
                  BlockPos p2 = q2.relative(d, L).relative(s.getOpposite(), W);
                  straight(q1, d, SL);
                  curve(p1, d, q1, d.getOpposite());
                  curve(q2, d, p2, d.getOpposite());
                  slots.add(new Slot(q1.relative(d, 56), d, s, k, name(k), pick(k)));
              }

              private void signal(Side sd) {
                  sigs.add(new Sig(sd.start().relative(sd.dir(), sd.len() - 4), sd.dir(), sd.dir().getClockWise()));
              }

              private boolean positive(Direction d) {
                  return (d.getAxisDirection() == Direction.AxisDirection.POSITIVE) ^ Config.FLIP_STATION.get();
              }

              // ------------------------------------------------------------------ ordered steps

              private void finish() {
                  for (Map.Entry<BlockPos, Direction.Axis> e : tracks.entrySet()) {
                      BlockPos p = e.getKey();
                      Direction.Axis ax = e.getValue();
                      steps.add(new Step(() -> buildTrack(p, ax), 70, 0));
                  }
                  steps.add(new Step(() -> {}, 0, 20));
                  for (Curve c : curves) steps.add(new Step(() -> buildCurve(c), 6, 0));
                  steps.add(new Step(() -> {}, 0, 30));
                  for (Slot s : slots) {
                      for (int i = -6; i <= 52; i += 8) {
                          int from = i, to = Math.min(i + 7, 52);
                          steps.add(new Step(() -> buildPlatform(s, from, to), 150, 0));
                      }
                  }
                  steps.add(new Step(() -> {}, 0, 10));
                  for (Slot s : slots) steps.add(new Step(() -> buildStation(s), 10, 0));
                  for (Sig g : sigs) steps.add(new Step(() -> buildSignal(g), 10, 0));
                  steps.add(new Step(() -> {}, 0, 60));
                  for (Slot s : slots) {
                      if (s.schem() == null) continue;
                      List<String> all = slots.stream().filter(o -> o.kind() == s.kind()).map(Slot::name).toList();
                      int i = all.indexOf(s.name());
                      List<String> dest = new ArrayList<>();
                      for (int k = 1; k <= all.size(); k++) dest.add(all.get((i + k) % all.size()));
                      steps.add(new Step(() -> TrainSpawner.spawn(level, s, dest), 20, 10));
                  }
                  steps.add(new Step(() -> level.getServer().getPlayerList()
                          .broadcastSystemMessage(Component.literal("Rail network complete!"), false), 1, 0));
              }

              // ------------------------------------------------------------------ world operations

              private void clear(BlockPos q) {
                  BlockState st = level.getBlockState(q);
                  if (st.isAir() || st.getDestroySpeed(level, q) < 0 || st.getBlock() instanceof TrackBlock) return;
                  level.setBlock(q, Blocks.AIR.defaultBlockState(), 2 | 16);
              }

              private boolean fillable(BlockPos q) {
                  BlockState st = level.getBlockState(q);
                  return st.isAir() || st.canBeReplaced() || !st.getFluidState().isEmpty() || st.is(BlockTags.LEAVES);
              }

              private void buildTrack(BlockPos p, Direction.Axis ax) {
                  Direction lat = ax == Direction.Axis.X ? Direction.SOUTH : Direction.EAST;
                  for (int l = -4; l <= 4; l++)
                      for (int h = 0; h <= 6; h++) {
                          if (l == 0 && h == 0) continue;
                          clear(p.relative(lat, l).above(h));
                      }
                  for (int l = -1; l <= 1; l++) {
                      BlockPos q = p.relative(lat, l).below();
                      if (level.getBlockState(q).getDestroySpeed(level, q) >= 0)
                          level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                  }
                  for (int k = 2; k <= 24; k++) {
                      BlockPos q = p.below(k);
                      if (!fillable(q)) break;
                      level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                  }
                  BlockState state = AllBlocks.TRACK.getDefaultState()
                          .setValue(TrackBlock.SHAPE, ax == Direction.Axis.X ? TrackShape.XO : TrackShape.ZO)
                          .setValue(TrackBlock.HAS_BE, be.contains(p));
                  level.setBlock(p, state, 3);
              }

              private static Vec3 vec(Direction d) { return new Vec3(d.getStepX(), 0, d.getStepZ()); }

              private void buildCurve(Curve c) {
                  BlockState sa = level.getBlockState(c.a()), sb = level.getBlockState(c.b());
                  if (!(sa.getBlock() instanceof TrackBlock ta) || !(sb.getBlock() instanceof TrackBlock tb)) return;
                  Vec3 ax1 = vec(c.aOut()), ax2 = vec(c.bOut());
                  Vec3 s1 = ta.getCurveStart(level, c.a(), sa, ax1), s2 = tb.getCurveStart(level, c.b(), sb, ax2);
                  Vec3 n1 = ta.getUpNormal(level, c.a(), sa), n2 = tb.getUpNormal(level, c.b(), sb);
                  BezierConnection bc = new BezierConnection(Couple.create(c.a(), c.b()), Couple.create(s1, s2),
                          Couple.create(ax1, ax2), Couple.create(n1, n2), true, false, ta.getMaterial());
                  if (level.getBlockEntity(c.a()) instanceof TrackBlockEntity t1 && level.getBlockEntity(c.b()) instanceof TrackBlockEntity t2) {
                      t1.addConnection(bc);
                      t2.addConnection(bc.secondary());
                      level.scheduleTick(c.a(), ta, 1);
                      level.scheduleTick(c.b(), tb, 1);
                  }
              }

              private void buildPlatform(Slot s, int from, int to) {
                  Direction back = s.dir().getOpposite();
                  for (int i = from; i <= to; i++)
                      for (int l = 3; l <= 5; l++) {
                          BlockPos p = s.track().relative(back, i).relative(s.side(), l);
                          for (int h = 1; h <= 6; h++) clear(p.above(h));
                          level.setBlock(p, (l == 3 ? Blocks.POLISHED_ANDESITE : Blocks.SMOOTH_STONE).defaultBlockState(), 2);
                          for (int k = 1; k <= 24; k++) {
                              BlockPos q = p.below(k);
                              if (!fillable(q)) break;
                              level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                          }
                      }
              }

              private void buildStation(Slot s) {
                  target(AllBlocks.TRACK_STATION.asStack(), s.track(), positive(s.dir()), s.station());
                  if (level.getBlockEntity(s.station()) instanceof StationBlockEntity sbe) sbe.updateName(s.name());
              }

              private void buildSignal(Sig g) {
                  BlockPos support = g.track().relative(g.side(), 2);
                  level.setBlock(support, Blocks.STONE_BRICKS.defaultBlockState(), 2);
                  target(AllBlocks.TRACK_SIGNAL.asStack(), g.track(), positive(g.dir()), support.above());
              }

              /** Uses Create's own track-targeting item exactly like a player would (select track, then place the block). */
              private void target(ItemStack stack, BlockPos track, boolean positive, BlockPos at) {
                  stack.set(AllDataComponents.TRACK_TARGETING_ITEM_SELECTED_POS, track);
                  stack.set(AllDataComponents.TRACK_TARGETING_ITEM_SELECTED_DIRECTION, positive);
                  FakePlayer fp = FakePlayerFactory.getMinecraft(level);
                  fp.setPos(at.getX() + 0.5, at.getY(), at.getZ() + 0.5);
                  fp.setItemInHand(InteractionHand.MAIN_HAND, stack);
                  BlockPos floor = at.below();
                  BlockHitResult hit = new BlockHitResult(Vec3.atCenterOf(floor).add(0, 0.5, 0), Direction.UP, floor, false);
                  stack.useOn(new UseOnContext(level, fp, InteractionHand.MAIN_HAND, stack, hit));
              }
          }
          EOF

          echo "Project generated:"; find src -type f | sort

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Collect result (jar + log)
        if: always()
        run: |
          mkdir -p result
          cp build.log result/build.log 2>/dev/null || echo "no log" > result/build.log
          cp build/libs/*.jar result/ 2>/dev/null || echo "No jar produced (build failed) - see build.log" > result/NO_JAR.txt
          rm -f result/*-sources.jar
          ls -la result

      - name: Upload result zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railnuke-result
          path: result/*
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
