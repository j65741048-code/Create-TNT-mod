name: Build Rail Nuke 1.1.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate project files
        run: |
          set -e
          exec > >(tee -a build.log) 2>&1
          pip install pillow
          R=src/main/resources
          J=src/main/java/com/railnuke
          mkdir -p $J $R/META-INF $R/assets/railnuke/{blockstates,models/block,models/item,textures/block,lang} $R/data/railnuke/{loot_table/blocks,recipe}

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          rootProject.name = 'railnuke'
          EOF

          echo "org.gradle.jvmargs=-Xmx3G" > gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

          cat > $R/pack.mcmeta <<'EOF'
          {"pack":{"description":"Rail Nuke","pack_format":34}}
          EOF

          cat > $R/META-INF/neoforge.mods.toml <<'EOF'
          modLoader="javafml"
          loaderVersion="[4,)"
          license="MIT"

          [[mods]]
          modId="railnuke"
          version="1.1.0"
          displayName="Rail Nuke: Train TNT"
          logoFile="logo.png"
          authors="You"
          description='''Four TNT blocks that explode into a whole Create railway network with realistic stations, cargo and fluid yards, signals, branch loops, rail yards with phantom-track loop-backs and AI trains driven by NPC conductors.'''

          [[dependencies.railnuke]]
          modId="neoforge"
          type="required"
          versionRange="[21.1,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.railnuke]]
          modId="minecraft"
          type="required"
          versionRange="[1.21.1,1.22)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.railnuke]]
          modId="create"
          type="required"
          versionRange="[6.0.0,)"
          ordering="AFTER"
          side="BOTH"

          [[dependencies.railnuke]]
          modId="railways"
          type="optional"
          versionRange="[0,)"
          ordering="AFTER"
          side="BOTH"
          EOF

          # ---------- textures + icon ----------
          cat > gen_art.py <<'EOF'
          from PIL import Image, ImageDraw
          BR = (212, 162, 76, 255)
          WH = (240, 240, 230, 255)
          T = ["###", ".#.", ".#.", ".#.", ".#."]
          N = ["#.#", "###", "###", "#.#", "#.#"]
          def side(col):
              im = Image.new('RGBA', (16, 16), (58, 60, 66, 255))
              d = ImageDraw.Draw(im)
              d.rectangle([0, 0, 15, 1], fill=BR)
              d.rectangle([0, 2, 15, 12], fill=col)
              d.rectangle([0, 2, 15, 2], fill=BR)
              for x in (1, 6, 11):
                  d.rectangle([x, 3, x + 3, 5], fill=(150, 200, 230, 255))
              d.rectangle([0, 6, 15, 6], fill=BR)
              for gi, g in enumerate([T, N, T]):
                  for yy, row in enumerate(g):
                      for xx, ch in enumerate(row):
                          if ch == '#':
                              im.putpixel((2 + gi * 4 + xx, 7 + yy), WH)
              for x in (2, 3, 11, 12):
                  d.rectangle([x, 13, x, 14], fill=(25, 25, 25, 255))
              d.rectangle([0, 15, 15, 15], fill=(130, 130, 130, 255))
              return im
          def top(col):
              im = Image.new('RGBA', (16, 16), (112, 114, 118, 255))
              d = ImageDraw.Draw(im)
              d.rectangle([0, 0, 15, 15], outline=BR)
              for y in range(1, 15, 3):
                  d.rectangle([2, y, 13, y], fill=(86, 70, 52, 255))
              d.rectangle([4, 1, 4, 14], fill=(190, 190, 190, 255))
              d.rectangle([11, 1, 11, 14], fill=(190, 190, 190, 255))
              d.rectangle([6, 6, 9, 9], fill=col)
              d.rectangle([7, 7, 8, 8], fill=(30, 30, 30, 255))
              return im
          cols = {'small': (63, 150, 80, 255), 'medium': (60, 110, 190, 255), 'large': (190, 60, 60, 255), 'mega': (140, 70, 190, 255)}
          base = 'src/main/resources/assets/railnuke/textures/block/'
          for k, c in cols.items():
              side(c).save(base + 'tnt_' + k + '_side.png')
              top(c).save(base + 'tnt_' + k + '_top.png')
          bot = Image.new('RGBA', (16, 16), (70, 72, 76, 255))
          ImageDraw.Draw(bot).rectangle([0, 0, 15, 15], outline=BR)
          bot.save(base + 'tnt_bottom.png')
          icon = Image.new('RGBA', (128, 128), (40, 42, 48, 255))
          d = ImageDraw.Draw(icon)
          d.rectangle([0, 0, 127, 127], outline=BR, width=4)
          icon.paste(side(cols['medium']).resize((96, 96), Image.NEAREST), (16, 16))
          icon.save('src/main/resources/logo.png')
          EOF
          python3 gen_art.py
          rm gen_art.py

          # ---------- json assets ----------
          for t in small medium large mega; do
            cat > $R/assets/railnuke/blockstates/tnt_$t.json <<EOF
          {"variants":{"":{"model":"railnuke:block/tnt_$t"}}}
          EOF
            cat > $R/assets/railnuke/models/block/tnt_$t.json <<EOF
          {"parent":"minecraft:block/cube_bottom_top","textures":{"top":"railnuke:block/tnt_${t}_top","bottom":"railnuke:block/tnt_bottom","side":"railnuke:block/tnt_${t}_side"}}
          EOF
            cat > $R/assets/railnuke/models/item/tnt_$t.json <<EOF
          {"parent":"railnuke:block/tnt_$t"}
          EOF
            cat > $R/data/railnuke/loot_table/blocks/tnt_$t.json <<EOF
          {"type":"minecraft:block","pools":[{"rolls":1,"entries":[{"type":"minecraft:item","name":"railnuke:tnt_$t"}],"conditions":[{"condition":"minecraft:survives_explosion"}]}]}
          EOF
          done

          cat > $R/assets/railnuke/lang/en_us.json <<'EOF'
          {
            "block.railnuke.tnt_small": "Rail TNT: Toy Set",
            "block.railnuke.tnt_medium": "Rail TNT: Regional Network",
            "block.railnuke.tnt_large": "Rail TNT: Grand Network",
            "block.railnuke.tnt_mega": "Rail TNT: Mega Railway Network",
            "entity.railnuke.conductor": "Train Conductor"
          }
          EOF

          cat > $R/data/railnuke/recipe/tnt_small.json <<'EOF'
          {"type":"minecraft:crafting_shapeless","category":"misc","ingredients":[{"item":"minecraft:tnt"},{"item":"create:track"},{"item":"create:track"},{"item":"create:track"}],"result":{"id":"railnuke:tnt_small","count":1}}
          EOF
          cat > $R/data/railnuke/recipe/tnt_medium.json <<'EOF'
          {"type":"minecraft:crafting_shapeless","category":"misc","ingredients":[{"item":"railnuke:tnt_small"},{"item":"create:railway_casing"},{"item":"create:track_station"},{"item":"create:track_signal"}],"result":{"id":"railnuke:tnt_medium","count":1}}
          EOF
          cat > $R/data/railnuke/recipe/tnt_large.json <<'EOF'
          {"type":"minecraft:crafting_shapeless","category":"misc","ingredients":[{"item":"railnuke:tnt_medium"},{"item":"minecraft:tnt"},{"item":"create:railway_casing"},{"item":"create:track_station"},{"item":"create:track_signal"}],"result":{"id":"railnuke:tnt_large","count":1}}
          EOF

          cat > $R/data/railnuke/recipe/tnt_mega.json <<'EOF'
          {"type":"minecraft:crafting_shapeless","category":"misc","ingredients":[{"item":"railnuke:tnt_large"},{"item":"minecraft:tnt"},{"item":"minecraft:tnt"},{"item":"create:railway_casing"},{"item":"create:track_station"},{"item":"create:track_signal"},{"item":"create:precision_mechanism"}],"result":{"id":"railnuke:tnt_mega","count":1}}
          EOF

          # ---------- java ----------
          cat > $J/RailNuke.java <<'EOF'
          package com.railnuke;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.ModContainer;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.fml.config.ModConfig;
          import net.neoforged.neoforge.event.BuildCreativeModeTabContentsEvent;
          import net.neoforged.neoforge.event.entity.EntityAttributeCreationEvent;
          import net.neoforged.neoforge.registries.DeferredBlock;
          import net.neoforged.neoforge.registries.DeferredHolder;
          import net.neoforged.neoforge.registries.DeferredItem;
          import net.neoforged.neoforge.registries.DeferredRegister;

          @Mod(RailNuke.ID)
          public class RailNuke {
              public static final String ID = "railnuke";
              public static final DeferredRegister.Blocks BLOCKS = DeferredRegister.createBlocks(ID);
              public static final DeferredRegister.Items ITEMS = DeferredRegister.createItems(ID);
              public static final DeferredRegister<EntityType<?>> ENTITIES = DeferredRegister.create(Registries.ENTITY_TYPE, ID);

              private static BlockBehaviour.Properties props() {
                  return BlockBehaviour.Properties.of().mapColor(MapColor.COLOR_RED).instabreak().sound(SoundType.GRASS).ignitedByLava();
              }

              public static final DeferredBlock<RailNukeBlock> SMALL = BLOCKS.register("tnt_small", () -> new RailNukeBlock(props(), 1));
              public static final DeferredBlock<RailNukeBlock> MEDIUM = BLOCKS.register("tnt_medium", () -> new RailNukeBlock(props(), 2));
              public static final DeferredBlock<RailNukeBlock> LARGE = BLOCKS.register("tnt_large", () -> new RailNukeBlock(props(), 3));
          public static final DeferredBlock<RailNukeBlock> MEGA = BLOCKS.register("tnt_mega", () -> new RailNukeBlock(props(), 4));
              public static final DeferredItem<BlockItem> SMALL_ITEM = ITEMS.registerSimpleBlockItem("tnt_small", SMALL);
              public static final DeferredItem<BlockItem> MEDIUM_ITEM = ITEMS.registerSimpleBlockItem("tnt_medium", MEDIUM);
              public static final DeferredItem<BlockItem> LARGE_ITEM = ITEMS.registerSimpleBlockItem("tnt_large", LARGE);
          public static final DeferredItem<BlockItem> MEGA_ITEM = ITEMS.registerSimpleBlockItem("tnt_mega", MEGA);

              public static final DeferredHolder<EntityType<?>, EntityType<ConductorEntity>> CONDUCTOR = ENTITIES.register("conductor",
                      () -> EntityType.Builder.of(ConductorEntity::new, MobCategory.MISC).sized(0.6f, 1.8f).clientTrackingRange(10).build("conductor"));

              public RailNuke(IEventBus bus, ModContainer container) {
                  BLOCKS.register(bus);
                  ITEMS.register(bus);
                  ENTITIES.register(bus);
                  container.registerConfig(ModConfig.Type.COMMON, Config.SPEC);
                  bus.addListener(this::attributes);
                  bus.addListener(this::tabs);
              }

              private void attributes(EntityAttributeCreationEvent e) {
                  e.put(CONDUCTOR.get(), ConductorEntity.attrs().build());
              }

              private void tabs(BuildCreativeModeTabContentsEvent e) {
                  if (e.getTabKey() == CreativeModeTabs.REDSTONE_BLOCKS) {
                      e.accept(SMALL_ITEM.get());
                      e.accept(MEDIUM_ITEM.get());
                      e.accept(LARGE_ITEM.get());
                      e.accept(MEGA_ITEM.get());
                  }
              }
          }
          EOF

          cat > $J/Config.java <<'EOF'
          package com.railnuke;

          import net.neoforged.neoforge.common.ModConfigSpec;

          public class Config {
              private static final ModConfigSpec.Builder B = new ModConfigSpec.Builder();
              public static final ModConfigSpec.BooleanValue SPAWN_TRAINS = B.comment("Spawn AI trains built from your Create schematics").define("spawnTrains", true);
              public static final ModConfigSpec.IntValue MIN_CARRIAGES = B.comment("Minimum carriages (locomotive + wagons). A train with fewer is removed").defineInRange("minCarriages", 2, 1, 20);
              public static final ModConfigSpec.IntValue MAX_CARRIAGES = B.comment("Maximum carriages. A train with more is removed").defineInRange("maxCarriages", 10, 1, 24);
              public static final ModConfigSpec.BooleanValue FLIP_STATION = B.comment("Starting guess for the station direction. The mod auto-corrects this by itself if the first train does not assemble").define("flipStationDirection", false);
              public static final ModConfigSpec.BooleanValue YARD_PHANTOM = B.comment("Mega network: use Steam 'n' Rails phantom tracks for the hidden loop-back of rail yard dead ends (needs the railways mod, otherwise normal tracks are used)").define("usePhantomTracks", true);
              public static final ModConfigSpec.ConfigValue<String> EXTRA_DIR = B.comment("Optional extra folder that is also searched for train schematics (.nbt). The game's own 'schematics' folder is always searched").define("extraSchematicFolder", "");
              public static final ModConfigSpec.IntValue BUDGET = B.comment("Build work per tick (lower = less lag)").defineInRange("workPerTick", 600, 50, 5000);
              public static final ModConfigSpec SPEC = B.build();
          }
          EOF

          cat > $J/RailNukeBlock.java <<'EOF'
          package com.railnuke;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.ItemInteractionResult;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.entity.projectile.Projectile;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Explosion;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import org.jetbrains.annotations.Nullable;

          public class RailNukeBlock extends Block {
              public final int tier;

              public RailNukeBlock(Properties p, int tier) {
                  super(p);
                  this.tier = tier;
              }

              private void ignite(Level level, BlockPos pos) {
                  if (level.isClientSide || !(level instanceof ServerLevel sl)) return;
                  sl.explode(null, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, 3.0F + tier, Level.ExplosionInteraction.NONE);
                  Jobs.start(sl, pos, tier);
              }

              @Override
              protected ItemInteractionResult useItemOn(ItemStack stack, BlockState state, Level level, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
                  if (!stack.is(Items.FLINT_AND_STEEL) && !stack.is(Items.FIRE_CHARGE)) {
                      return super.useItemOn(stack, state, level, pos, player, hand, hit);
                  }
                  ignite(level, pos);
                  level.setBlock(pos, Blocks.AIR.defaultBlockState(), 11);
                  if (!player.isCreative()) {
                      if (stack.is(Items.FLINT_AND_STEEL)) stack.hurtAndBreak(1, player, LivingEntity.getSlotForHand(hand));
                      else stack.shrink(1);
                  }
                  return ItemInteractionResult.sidedSuccess(level.isClientSide);
              }

              @Override
              protected void onPlace(BlockState state, Level level, BlockPos pos, BlockState old, boolean moved) {
                  if (!old.is(state.getBlock()) && level.hasNeighborSignal(pos)) {
                      ignite(level, pos);
                      level.removeBlock(pos, false);
                  }
              }

              @Override
              protected void neighborChanged(BlockState state, Level level, BlockPos pos, Block block, BlockPos from, boolean moved) {
                  if (level.hasNeighborSignal(pos)) {
                      ignite(level, pos);
                      level.removeBlock(pos, false);
                  }
              }

              @Override
              public void onCaughtFire(BlockState state, Level level, BlockPos pos, @Nullable Direction face, @Nullable LivingEntity igniter) {
                  ignite(level, pos);
              }

              @Override
              public void wasExploded(Level level, BlockPos pos, Explosion explosion) {
                  ignite(level, pos);
              }

              @Override
              protected void onProjectileHit(Level level, BlockState state, BlockHitResult hit, Projectile projectile) {
                  if (!level.isClientSide) {
                      BlockPos pos = hit.getBlockPos();
                      if (projectile.isOnFire() && projectile.mayInteract(level, pos)) {
                          ignite(level, pos);
                          level.removeBlock(pos, false);
                      }
                  }
              }
          }
          EOF

          cat > $J/ConductorEntity.java <<'EOF'
          package com.railnuke;

          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.PathfinderMob;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.level.Level;

          /** Player-looking NPC that sits at the controls of AI trains. */
          public class ConductorEntity extends PathfinderMob {
              private static final EntityDataAccessor<Integer> SKIN = SynchedEntityData.defineId(ConductorEntity.class, EntityDataSerializers.INT);

              public ConductorEntity(EntityType<? extends PathfinderMob> type, Level level) {
                  super(type, level);
                  setNoAi(true);
                  setPersistenceRequired();
                  setInvulnerable(true);
              }

              public static AttributeSupplier.Builder attrs() {
                  return Mob.createMobAttributes().add(Attributes.MAX_HEALTH, 20.0);
              }

              @Override
              protected void defineSynchedData(SynchedEntityData.Builder b) {
                  super.defineSynchedData(b);
                  b.define(SKIN, 0);
              }

              public int getSkin() { return entityData.get(SKIN); }
              public void setSkin(int i) { entityData.set(SKIN, i); }

              @Override
              public void addAdditionalSaveData(CompoundTag t) {
                  super.addAdditionalSaveData(t);
                  t.putInt("Skin", getSkin());
              }

              @Override
              public void readAdditionalSaveData(CompoundTag t) {
                  super.readAdditionalSaveData(t);
                  setSkin(t.getInt("Skin"));
              }

              @Override
              public boolean removeWhenFarAway(double d) { return false; }
          }
          EOF

          cat > $J/ConductorRenderer.java <<'EOF'
          package com.railnuke;

          import net.minecraft.client.model.PlayerModel;
          import net.minecraft.client.model.geom.ModelLayers;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.HumanoidMobRenderer;
          import net.minecraft.resources.ResourceLocation;

          public class ConductorRenderer extends HumanoidMobRenderer<ConductorEntity, PlayerModel<ConductorEntity>> {
              private static final String[] SKINS = {"alex", "ari", "efe", "kai", "makena", "noor", "steve", "sunny", "zuri"};

              public ConductorRenderer(EntityRendererProvider.Context ctx) {
                  super(ctx, new PlayerModel<>(ctx.bakeLayer(ModelLayers.PLAYER), false), 0.5F);
              }

              @Override
              public ResourceLocation getTextureLocation(ConductorEntity e) {
                  return ResourceLocation.withDefaultNamespace("textures/entity/player/wide/" + SKINS[Math.floorMod(e.getSkin(), SKINS.length)] + ".png");
              }
          }
          EOF

          cat > $J/Client.java <<'EOF'
          package com.railnuke;

          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.client.event.EntityRenderersEvent;

          @EventBusSubscriber(modid = RailNuke.ID, bus = EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public class Client {
              @SubscribeEvent
              public static void renderers(EntityRenderersEvent.RegisterRenderers e) {
                  e.registerEntityRenderer(RailNuke.CONDUCTOR.get(), ConductorRenderer::new);
              }
          }
          EOF

          cat > $J/Jobs.java <<'EOF'
          package com.railnuke;

          import com.mojang.logging.LogUtils;
          import net.minecraft.core.BlockPos;
          import net.minecraft.server.level.ServerLevel;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.neoforge.event.server.ServerStoppingEvent;
          import net.neoforged.neoforge.event.tick.ServerTickEvent;
          import org.slf4j.Logger;

          import java.util.ArrayDeque;

          /** Runs network builds a little every tick so the server never freezes. */
          @EventBusSubscriber(modid = RailNuke.ID)
          public final class Jobs {
              static final Logger LOG = LogUtils.getLogger();
              private static final ArrayDeque<Plan> QUEUE = new ArrayDeque<>();

              private Jobs() {}

              static void start(ServerLevel level, BlockPos pos, int tier) {
                  try {
                      QUEUE.add(new Plan(level, pos, tier));
                  } catch (Throwable t) {
                      LOG.error("Rail Nuke: could not plan network", t);
                  }
              }

              @SubscribeEvent
              public static void tick(ServerTickEvent.Post e) {
                  Plan p = QUEUE.peek();
                  if (p == null) return;
                  if (p.wait > 0) { p.wait--; return; }
                  int budget = Config.BUDGET.get();
                  while (budget > 0 && !p.steps.isEmpty()) {
                      Plan.Step s = p.steps.pollFirst();
                      try {
                          s.run().run();
                      } catch (Throwable t) {
                          LOG.warn("Rail Nuke step failed (skipped): {}", t.toString());
                      }
                      budget -= Math.max(1, s.cost());
                      if (s.waitAfter() > 0) { p.wait = s.waitAfter(); break; }
                  }
                  if (p.steps.isEmpty()) QUEUE.poll();
              }

              @SubscribeEvent
              public static void stopping(ServerStoppingEvent e) {
                  QUEUE.clear();
              }
          }
          EOF

          cat > $J/Schematics.java <<'EOF'
          package com.railnuke;

          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.nbt.ListTag;
          import net.minecraft.nbt.NbtAccounter;
          import net.minecraft.nbt.NbtIo;
          import net.neoforged.fml.loading.FMLPaths;

          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.stream.Stream;

          /** Finds Create schematics (.nbt) in the game's schematics folder and classifies the ones that are trains. */
          final class Schematics {
              record Info(String file, Plan.Kind kind, CompoundTag tag, List<int[]> bogeys, boolean axisX) {}

              private Schematics() {}

              static Path mainRoot() {
                  return FMLPaths.GAMEDIR.get().resolve("schematics");
              }

              static List<Info> scan() {
                  List<Info> out = new ArrayList<>();
                  List<Path> roots = new ArrayList<>();
                  roots.add(mainRoot());
                  try {
                      String extra = Config.EXTRA_DIR.get();
                      if (extra != null && !extra.isBlank()) roots.add(Path.of(extra.trim()));
                  } catch (Exception e) {
                      Jobs.LOG.warn("Rail Nuke: bad extraSchematicFolder: {}", e.toString());
                  }
                  for (Path root : roots) {
                      if (!Files.isDirectory(root)) {
                          Jobs.LOG.info("Rail Nuke: schematic folder does not exist: {}", root);
                          continue;
                      }
                      try (Stream<Path> w = Files.walk(root, 6)) {
                          w.filter(p -> p.toString().toLowerCase().endsWith(".nbt")).forEach(p -> {
                              Info i = analyse(p);
                              if (i != null) out.add(i);
                          });
                      } catch (Exception e) {
                          Jobs.LOG.warn("Rail Nuke: schematic scan failed: {}", e.toString());
                      }
                  }
                  Jobs.LOG.info("Rail Nuke: {} usable train schematic(s) found", out.size());
                  return out;
              }

              private static Info skip(Path p, String why) {
                  Jobs.LOG.info("Rail Nuke: schematic {} skipped: {}", p.getFileName(), why);
                  return null;
              }

              private static Info analyse(Path p) {
                  try (InputStream in = Files.newInputStream(p)) {
                      CompoundTag tag = NbtIo.readCompressed(in, NbtAccounter.unlimitedHeap());
                      if (!tag.contains("palette", 9) || !tag.contains("blocks", 9)) return skip(p, "not a structure/schematic file");
                      ListTag pal = tag.getList("palette", 10);
                      String[] names = new String[pal.size()];
                      for (int i = 0; i < names.length; i++) names[i] = pal.getCompound(i).getString("Name");
                      ListTag blocks = tag.getList("blocks", 10);
                      ListTag kept = new ListTag();
                      List<int[]> bogeys = new ArrayList<>();
                      int controls = 0, seats = 0, cargo = 0, fluid = 0;
                      for (int i = 0; i < blocks.size(); i++) {
                          CompoundTag b = blocks.getCompound(i);
                          int st = b.getInt("state");
                          if (st < 0 || st >= names.length) continue;
                          String n = names[st];
                          String path = n.contains(":") ? n.substring(n.indexOf(':') + 1) : n;
                          if (path.contains("track")) continue; // tracks are dropped, ours are already there
                          kept.add(b);
                          ListTag pos = b.getList("pos", 3);
                          if (path.contains("bogey")) bogeys.add(new int[]{pos.getInt(0), pos.getInt(1), pos.getInt(2)});
                          else if (path.equals("controls") || path.endsWith("_controls")) controls++;
                          else if (path.endsWith("_seat") || path.equals("seat")) seats++;
                          else if (path.contains("fluid") || path.contains("tank") || path.contains("pump")) fluid++;
                          else if (path.contains("item_vault") || path.contains("item_hatch") || path.contains("cargo") || path.contains("storage_interface")) cargo++;
                      }
                      if (bogeys.size() < 2) return skip(p, "needs at least 2 bogeys (found " + bogeys.size() + ")");
                      if (controls == 0) return skip(p, "no Train Controls block");
                      if (seats == 0) return skip(p, "no seat (the conductor needs a seat next to the controls)");
                      if (bogeys.size() > Config.MAX_CARRIAGES.get() * 2) return skip(p, "too many bogeys (" + bogeys.size() + "), raise maxCarriages in the config");
                      int minX = Integer.MAX_VALUE, maxX = Integer.MIN_VALUE, minZ = Integer.MAX_VALUE, maxZ = Integer.MIN_VALUE;
                      for (int[] b : bogeys) {
                          minX = Math.min(minX, b[0]); maxX = Math.max(maxX, b[0]);
                          minZ = Math.min(minZ, b[2]); maxZ = Math.max(maxZ, b[2]);
                      }
                      boolean axisX = (maxX - minX) >= (maxZ - minZ);
                      ListTag size = tag.getList("size", 3);
                      if (size.size() == 3 && (axisX ? size.getInt(0) : size.getInt(2)) > 70) return skip(p, "train is longer than 70 blocks");
                      tag.put("blocks", kept);
                      Plan.Kind kind = cargo > 0 ? Plan.Kind.CARGO : fluid > 0 ? Plan.Kind.FLUID : Plan.Kind.PASSENGER;
                      Jobs.LOG.info("Rail Nuke: schematic {} accepted as {} train ({} bogeys)", p.getFileName(), kind, bogeys.size());
                      return new Info(p.getFileName().toString(), kind, tag, bogeys, axisX);
                  } catch (Exception e) {
                      return skip(p, e.toString());
                  }
              }
          }
