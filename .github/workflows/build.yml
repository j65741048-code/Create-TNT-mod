          import net.minecraft.world.phys.Vec3;
          import net.neoforged.neoforge.common.util.FakePlayer;
          import net.neoforged.neoforge.common.util.FakePlayerFactory;

          import java.util.*;

          /**
           * One explosion = one Plan: a list of small build steps (tracks, curves, platforms, stations, signals, trains, scenery)
           * that Jobs executes a few per tick.
           */
          final class Plan {
              enum Kind {
                  PASSENGER("Passenger"), CARGO("Cargo"), FLUID("Fluid");
                  final String label;
                  Kind(String l) { label = l; }
              }

              record Step(Runnable run, int cost, int waitAfter) {}
              record Curve(BlockPos a, Direction aOut, BlockPos b, Direction bOut) {}
              record Side(BlockPos start, Direction dir, int len) {}
              record Sig(BlockPos track, Direction dir, Direction side) {}
              record Bed(BlockPos origin, Direction d, Direction o, int from, int to, int width) {}
              record Buf(BlockPos pos, Direction d) {}
              record Slot(BlockPos track, Direction dir, Direction side, Kind kind, String name, Schematics.Info schem) {
                  BlockPos station() { return track.relative(side, 3).above(); }
              }

              /** station direction that was proven to work (null = not known yet). Shared by all networks in this session. */
              static Boolean learned = null;

              static final int FRONT = 8;   // platform blocks in front of the station block
              static final int BACK = 52;   // platform blocks behind the station block (where the train stands)

              final ServerLevel level;
              final Deque<Step> steps = new ArrayDeque<>();
              int wait;

              // shared with TrainSpawner
              final Map<Slot, BoundingBox> boxes = new IdentityHashMap<>();
              final Set<Slot> trained = Collections.newSetFromMap(new IdentityHashMap<>());
              int spawned, failed;

              private final int y, ox, oz;
              private final Map<BlockPos, Direction.Axis> tracks = new LinkedHashMap<>();
              private final Set<BlockPos> be = new HashSet<>();
              private final Set<BlockPos> phantom = new HashSet<>();
              private final List<Curve> curves = new ArrayList<>();
              private final List<Slot> slots = new ArrayList<>();
              private final List<Sig> sigs = new ArrayList<>();
              private final List<Bed> beds = new ArrayList<>();
              private final List<Buf> buffers = new ArrayList<>();
              private final Map<Slot, Boolean> used = new IdentityHashMap<>();
              private final List<Schematics.Info> pool;
              private final Block phantomBlock;
              private final Map<Kind, Integer> counts = new EnumMap<>(Kind.class);
              private final RandomSource rnd = RandomSource.create();

              Plan(ServerLevel level, BlockPos o, int tier) {
                  this.level = level;
                  this.y = o.getY();
                  this.ox = o.getX();
                  this.oz = o.getZ();
                  this.pool = Config.SPAWN_TRAINS.get() ? Schematics.scan() : List.of();
                  this.phantomBlock = Config.YARD_PHANTOM.get() ? modBlock("railways", "track_phantom") : null;
                  switch (tier) {
                      case 1 -> tier1();
                      case 2 -> tier2();
                      case 3 -> tier3();
                      default -> tier4();
                  }
                  finish();
              }

              // ------------------------------------------------------------------ layouts

              /** Type 1: toy-train oval, one station, exactly one AI train. */
              private void tier1() {
                  List<Side> s = ring(92, 56, 8);
                  slot(s.get(0), 62, null, true);
              }

              /** Type 2: regional network: ring + 2 branch loops (cargo, fluid) + 4 passenger stations + signals = 6 trains. */
              private void tier2() {
                  List<Side> s = ring(180, 110, 8);
                  loop(s.get(0), 4, Kind.CARGO);
                  slot(s.get(0), 152, Kind.PASSENGER, false);
                  slot(s.get(1), 64, Kind.PASSENGER, false);
                  loop(s.get(2), 4, Kind.FLUID);
                  slot(s.get(2), 152, Kind.PASSENGER, false);
                  slot(s.get(3), 64, Kind.PASSENGER, false);
                  for (Side sd : s) signal(sd);
              }

              /** Type 3: grand network: bigger ring, 6 branch loops, 4 main stations, signals = 10 trains. */
              private void tier3() {
                  List<Side> s = ring(300, 180, 10);
                  loop(s.get(0), 4, Kind.CARGO);
                  loop(s.get(0), 106, Kind.FLUID);
                  slot(s.get(0), 270, Kind.PASSENGER, false);
                  loop(s.get(1), 4, Kind.CARGO);
                  slot(s.get(1), 152, Kind.PASSENGER, false);
                  loop(s.get(2), 4, Kind.FLUID);
                  loop(s.get(2), 106, Kind.CARGO);
                  slot(s.get(2), 270, Kind.PASSENGER, false);
                  loop(s.get(3), 4, Kind.PASSENGER);
                  slot(s.get(3), 152, Kind.PASSENGER, false);
                  for (Side sd : s) signal(sd);
              }

              /**
               * Type 4: MEGA network. A huge ring with branch loops and stations on the inside and four big rail yards on the outside.
               * Every yard is a ladder of parallel dead-end tracks with buffer stops. A phantom track (Steam 'n' Rails) carries each
               * dead end on, invisibly, and merges it back into the next track, so the whole network is still one connected loop.
               */
              private void tier4() {
                  List<Side> s = ring(440, 260, 12);
                  loop(s.get(0), 4, Kind.CARGO);
                  slot(s.get(0), 152, Kind.PASSENGER, false);
                  loop(s.get(0), 176, Kind.FLUID);
                  slot(s.get(0), 330, Kind.CARGO, false);
                  yard(s.get(0), 200, 4);

                  loop(s.get(1), 4, Kind.PASSENGER);
                  slot(s.get(1), 152, Kind.FLUID, false);
                  yard(s.get(1), 20, 4);

                  loop(s.get(2), 4, Kind.CARGO);
                  slot(s.get(2), 152, Kind.PASSENGER, false);
                  loop(s.get(2), 176, Kind.FLUID);
                  slot(s.get(2), 330, Kind.PASSENGER, false);
                  yard(s.get(2), 200, 4);

                  loop(s.get(3), 4, Kind.FLUID);
                  slot(s.get(3), 152, Kind.CARGO, false);
                  yard(s.get(3), 20, 4);
                  for (Side sd : s) signal(sd);
              }

              // ------------------------------------------------------------------ plan helpers

              private BlockPos at(int x, int z) { return new BlockPos(ox + x, y, oz + z); }

              /** position on a platform: i = blocks behind the station block (negative = in front), l = blocks sideways from the track */
              private BlockPos at(Slot s, int i, int l) {
                  return s.track().relative(s.dir().getOpposite(), i).relative(s.side(), l);
              }

              private void straight(BlockPos from, Direction d, int n) {
                  for (int i = 0; i <= n; i++) tracks.putIfAbsent(from.relative(d, i), d.getAxis());
              }

              private void phantomStraight(BlockPos from, Direction d, int n) {
                  for (int i = 0; i <= n; i++) {
                      BlockPos p = from.relative(d, i);
                      tracks.putIfAbsent(p, d.getAxis());
                      phantom.add(p);
                  }
              }

              private void curve(BlockPos a, Direction aOut, BlockPos b, Direction bOut) {
                  tracks.putIfAbsent(a, aOut.getAxis());
                  tracks.putIfAbsent(b, bOut.getAxis());
                  be.add(a);
                  be.add(b);
                  curves.add(new Curve(a, aOut, b, bOut));
              }

              /** Clockwise rounded-rectangle loop with 90 degree spline corners. */
              private List<Side> ring(int w, int h, int r) {
                  Direction[] ds = {Direction.EAST, Direction.SOUTH, Direction.WEST, Direction.NORTH};
                  BlockPos s = at(-w / 2 + r, -h / 2);
                  List<Side> out = new ArrayList<>();
                  for (int i = 0; i < 4; i++) {
                      Direction d = ds[i], n = ds[(i + 1) % 4];
                      int len = (i % 2 == 0) ? w - 2 * r : h - 2 * r;
                      straight(s, d, len);
                      out.add(new Side(s, d, len));
                      BlockPos e = s.relative(d, len);
                      BlockPos nb = e.relative(d, r).relative(n, r);
                      curve(e, d, nb, n.getOpposite());
                      s = nb;
                  }
                  return out;
              }

              private Schematics.Info pick(Kind k) {
                  List<Schematics.Info> l = pool.stream().filter(i -> k == null || i.kind() == k).toList();
                  if (l.isEmpty()) l = pool; // no train of that kind: any train is better than an empty station
                  return l.isEmpty() ? null : l.get(rnd.nextInt(l.size()));
              }

              private String name(Kind k) {
                  int n = counts.merge(k, 1, Integer::sum);
                  return k.label + " " + (char) ('A' + n - 1);
              }

              /** Station on the main line (platform on the inner side, train stands behind the station block). */
              private void slot(Side sd, int off, Kind k, boolean anyKind) {
                  Schematics.Info sc;
                  if (anyKind) {
                      sc = pick(null);
                      k = sc != null ? sc.kind() : Kind.PASSENGER;
                  } else {
                      sc = pick(k);
                  }
                  BlockPos tr = sd.start().relative(sd.dir(), off);
                  slots.add(new Slot(tr, sd.dir(), sd.dir().getClockWise(), k, name(k), sc));
              }

              /** Branch line: an S-curve switch off the main line, a parallel siding with a station, and an S-curve merge back. */
              private void loop(Side sd, int off, Kind k) {
                  Direction d = sd.dir(), s = d.getClockWise();
                  int L = 16, W = 6, SL = 64;
                  BlockPos p1 = sd.start().relative(d, off);
                  BlockPos q1 = p1.relative(d, L).relative(s, W);
                  BlockPos q2 = q1.relative(d, SL);
                  BlockPos p2 = q2.relative(d, L).relative(s.getOpposite(), W);
                  straight(q1, d, SL);
                  curve(p1, d, q1, d.getOpposite());
                  curve(q2, d, p2, d.getOpposite());
                  slots.add(new Slot(q1.relative(d, 56), d, s, k, name(k), pick(k)));
              }

              private BlockPos yp(Side sd, int along, int lat, Direction o) {
                  return sd.start().relative(sd.dir(), along).relative(o, lat);
              }

              /**
               * Rail yard on the OUTER side of a main-line side: a ladder of parallel tracks. Track k branches off track k-1.
               * It ends in a visible dead end with a buffer stop, but a phantom track continues from there and merges back into
               * track k-1 (and track 1 merges back into the main line), so trains can still drive through.
               */
              private void yard(Side sd, int off, int stubs) {
                  Direction d = sd.dir(), o = d.getCounterClockWise();
                  final int L = 16, W = 6, STEP = 20, TAIL = 36, GAP = 8;
                  int mLast = off + L + STEP * (stubs - 1) + TAIL;
                  for (int k = 1; k <= stubs; k++) {
                      int pLong = off + STEP * (k - 1);
                      int qLong = pLong + L;
                      int m = mLast + STEP * (stubs - k);
                      int rLong = m + L;
                      int vLong = m - GAP;
                      BlockPos p = yp(sd, pLong, W * (k - 1), o);
                      BlockPos q = yp(sd, qLong, W * k, o);
                      straight(q, d, vLong - qLong);
                      BlockPos f = yp(sd, vLong + 1, W * k, o);
                      if (phantomBlock != null) {
                          phantomStraight(f, d, m - vLong - 1);
                          buffers.add(new Buf(f, d));
                      } else {
                          straight(f, d, m - vLong - 1);
                      }
                      BlockPos mp = yp(sd, m, W * k, o);
                      BlockPos r = yp(sd, rLong, W * (k - 1), o);
                      curve(p, d, q, d.getOpposite());
                      curve(mp, d, r, d.getOpposite());
                  }
                  beds.add(new Bed(sd.start(), d, o, off + 4, mLast + STEP * (stubs - 1) + L, W * stubs + 3));
              }

              private void signal(Side sd) {
                  sigs.add(new Sig(sd.start().relative(sd.dir(), sd.len() - 4), sd.dir(), sd.dir().getClockWise()));
              }

              static boolean positive(Direction d, boolean flip) {
                  return (d.getAxisDirection() == Direction.AxisDirection.POSITIVE) ^ flip;
              }

              private static boolean flipNow() {
                  return learned != null ? learned : Config.FLIP_STATION.get();
              }

              boolean used(Slot s) {
                  return used.getOrDefault(s, flipNow());
              }

              // ------------------------------------------------------------------ ordered steps

              private void finish() {
                  for (Map.Entry<BlockPos, Direction.Axis> e : tracks.entrySet()) {
                      BlockPos p = e.getKey();
                      Direction.Axis ax = e.getValue();
                      steps.add(new Step(() -> buildTrack(p, ax), 70, 0));
                  }
                  steps.add(new Step(() -> {}, 0, 20));
                  for (Curve c : curves) steps.add(new Step(() -> buildCurve(c), 6, 0));
                  steps.add(new Step(() -> {}, 0, 30));
                  for (Bed b : beds)
                      for (int a = b.from(); a <= b.to(); a += 8) {
                          int from = a, to = Math.min(a + 7, b.to());
                          steps.add(new Step(() -> buildBed(b, from, to), 200, 0));
                      }
                  for (Buf b : buffers) steps.add(new Step(() -> buildBuffer(b), 6, 0));
                  for (Slot s : slots) {
                      for (int i = -FRONT; i <= BACK; i += 8) {
                          int from = i, to = Math.min(i + 7, BACK);
                          steps.add(new Step(() -> buildPlatform(s, from, to), 150, 0));
                      }
                  }
                  steps.add(new Step(() -> {}, 0, 10));
                  for (Slot s : slots) steps.add(new Step(() -> buildStation(s), 10, 0));
                  for (Sig g : sigs) steps.add(new Step(() -> buildSignal(g), 10, 0));
                  steps.add(new Step(() -> {}, 0, 60));
                  for (Slot s : slots) {
                      if (s.schem() == null) continue;
                      List<String> all = slots.stream().filter(o -> o.kind() == s.kind()).map(Slot::name).toList();
                      int i = all.indexOf(s.name());
                      List<String> dest = new ArrayList<>();
                      for (int k = 1; k <= all.size(); k++) dest.add(all.get((i + k) % all.size()));
                      steps.add(new Step(() -> TrainSpawner.spawn(level, this, s, dest, 0), 20, 10));
                  }
                  // stations that got no train must still face the direction that was proven to work
                  steps.add(new Step(() -> {
                      if (learned == null) return;
                      for (Slot s : slots) if (!trained.contains(s) && used(s) != learned) retarget(s, learned);
                  }, 10, 20));
                  // scenery last: the train blocks are gone by now, so nothing gets in the way
                  for (Slot s : slots) steps.add(new Step(() -> decorate(s), 120, 0));
                  steps.add(new Step(() -> level.getServer().getPlayerList().broadcastSystemMessage(Component.literal(summary()), false), 1, 0));
              }

              private String summary() {
                  if (!Config.SPAWN_TRAINS.get()) return "Rail network complete! (train spawning is off in the config)";
                  if (pool.isEmpty())
                      return "Rail network complete, but NO usable train schematic was found in " + Schematics.mainRoot()
                              + " (a train needs Train Controls, a seat and at least 2 bogeys). See the log for details.";
                  return "Rail network complete! Trains spawned: " + spawned + (failed > 0 ? " (failed: " + failed + ", see log)" : "");
              }

              // ------------------------------------------------------------------ world operations

              private static Block modBlock(String ns, String path) {
                  return BuiltInRegistries.BLOCK.getOptional(ResourceLocation.fromNamespaceAndPath(ns, path)).orElse(null);
              }

              private static <T extends Comparable<T>> BlockState trySet(BlockState st, Property<T> p, String v) {
                  return p.getValue(v).map(x -> st.setValue(p, x)).orElse(st);
              }

              private static BlockState prop(BlockState st, String name, String value) {
                  Property<?> p = st.getBlock().getStateDefinition().getProperty(name);
                  return p == null ? st : trySet(st, p, value);
              }

              private void clear(BlockPos q) {
                  BlockState st = level.getBlockState(q);
                  if (st.isAir() || st.getDestroySpeed(level, q) < 0 || st.getBlock() instanceof TrackBlock) return;
                  level.setBlock(q, Blocks.AIR.defaultBlockState(), 2 | 16);
              }

              private boolean fillable(BlockPos q) {
                  BlockState st = level.getBlockState(q);
                  return st.isAir() || st.canBeReplaced() || !st.getFluidState().isEmpty() || st.is(BlockTags.LEAVES);
              }

              private void foundation(BlockPos p) {
                  for (int k = 1; k <= 24; k++) {
                      BlockPos q = p.below(k);
                      if (!fillable(q)) break;
                      level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                  }
              }

              private void buildTrack(BlockPos p, Direction.Axis ax) {
                  boolean ph = phantomBlock != null && phantom.contains(p);
                  Direction lat = ax == Direction.Axis.X ? Direction.SOUTH : Direction.EAST;
                  if (ph) {
                      for (int h = 1; h <= 4; h++) clear(p.above(h));
                  } else {
                      for (int l = -4; l <= 4; l++)
                          for (int h = 0; h <= 6; h++) {
                              if (l == 0 && h == 0) continue;
                              clear(p.relative(lat, l).above(h));
                          }
                      for (int l = -1; l <= 1; l++) {
                          BlockPos q = p.relative(lat, l).below();
                          if (level.getBlockState(q).getDestroySpeed(level, q) >= 0)
                              level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                      }
                      for (int k = 2; k <= 24; k++) {
                          BlockPos q = p.below(k);
                          if (!fillable(q)) break;
                          level.setBlock(q, Blocks.STONE_BRICKS.defaultBlockState(), 2 | 16);
                      }
                  }
                  Block base = ph ? phantomBlock : AllBlocks.TRACK.get();
                  if (!(base instanceof TrackBlock)) base = AllBlocks.TRACK.get();
                  BlockState state = base.defaultBlockState()
                          .setValue(TrackBlock.SHAPE, ax == Direction.Axis.X ? TrackShape.XO : TrackShape.ZO)
                          .setValue(TrackBlock.HAS_BE, be.contains(p));
                  level.setBlock(p, state, 3);
              }

              private static Vec3 vec(Direction d) { return new Vec3(d.getStepX(), 0, d.getStepZ()); }

              private void buildCurve(Curve c) {
                  BlockState sa = level.getBlockState(c.a()), sb = level.getBlockState(c.b());
                  if (!(sa.getBlock() instanceof TrackBlock ta) || !(sb.getBlock() instanceof TrackBlock tb)) return;
                  Vec3 ax1 = vec(c.aOut()), ax2 = vec(c.bOut());
                  Vec3 s1 = ta.getCurveStart(level, c.a(), sa, ax1), s2 = tb.getCurveStart(level, c.b(), sb, ax2);
                  Vec3 n1 = ta.getUpNormal(level, c.a(), sa), n2 = tb.getUpNormal(level, c.b(), sb);
                  BezierConnection bc = new BezierConnection(Couple.create(c.a(), c.b()), Couple.create(s1, s2),
                          Couple.create(ax1, ax2), Couple.create(n1, n2), true, false, ta.getMaterial());
                  if (level.getBlockEntity(c.a()) instanceof TrackBlockEntity t1 && level.getBlockEntity(c.b()) instanceof TrackBlockEntity t2) {
                      t1.addConnection(bc);
                      t2.addConnection(bc.secondary());
                      level.scheduleTick(c.a(), ta, 1);
                      level.scheduleTick(c.b(), tb, 1);
                  }
              }

              /** gravel bed between the yard tracks */
              private void buildBed(Bed b, int from, int to) {
                  for (int lg = from; lg <= to; lg++)
                      for (int lat = 2; lat <= b.width(); lat++) {
                          BlockPos p = b.origin().relative(b.d(), lg).relative(b.o(), lat);
                          if (level.getBlockState(p).getBlock() instanceof TrackBlock) continue;
                          BlockPos g = p.below();
                          if (level.getBlockState(g).is(Blocks.STONE_BRICKS)) continue;
                          for (int h = 0; h <= 4; h++) clear(p.above(h));
                          if (level.getBlockState(g).getDestroySpeed(level, g) >= 0)
                              level.setBlock(g, Blocks.GRAVEL.defaultBlockState(), 2 | 16);
                      }
              }

              /** buffer stop at the visible end of a yard track (the phantom track carries on under it) */
              private void buildBuffer(Buf b) {
                  Direction lat = b.d().getClockWise();
                  BlockPos c = b.pos().above();
                  level.setBlock(c, Blocks.RED_CONCRETE.defaultBlockState(), 2);
                  level.setBlock(c.above(), Blocks.YELLOW_CARPET.defaultBlockState(), 2);
                  level.setBlock(c.relative(lat), Blocks.IRON_BARS.defaultBlockState(), 2);
                  level.setBlock(c.relative(lat.getOpposite()), Blocks.IRON_BARS.defaultBlockState(), 2);
              }

              private void buildPlatform(Slot s, int from, int to) {
                  for (int i = from; i <= to; i++)
                      for (int l = 3; l <= 5; l++) {
                          BlockPos p = at(s, i, l);
                          for (int h = 1; h <= 6; h++) clear(p.above(h));
                          // yellow safety stripe on the edge, light stone further back
                          Block top = l == 3 ? Blocks.YELLOW_TERRACOTTA : l == 4 ? Blocks.POLISHED_ANDESITE : Blocks.SMOOTH_STONE;
                          level.setBlock(p, top.defaultBlockState(), 2);
                          foundation(p);
                      }
              }

              private void buildStation(Slot s) {
                  boolean flip = flipNow();
                  used.put(s, flip);
                  placeStation(s, flip);
              }

              private void placeStation(Slot s, boolean flip) {
                  target(AllBlocks.TRACK_STATION.asStack(), s.track(), positive(s.dir(), flip), s.station());
                  if (level.getBlockEntity(s.station()) instanceof StationBlockEntity sbe) sbe.updateName(s.name());
              }

              /** Turn a station around (used when Create did not assemble the train with the first direction). */
              void retarget(Slot s, boolean flip) {
                  level.destroyBlock(s.station(), false);
                  used.put(s, flip);
                  placeStation(s, flip);
              }

              private void buildSignal(Sig g) {
                  BlockPos support = g.track().relative(g.side(), 2);
                  level.setBlock(support, Blocks.STONE_BRICKS.defaultBlockState(), 2);
                  target(AllBlocks.TRACK_SIGNAL.asStack(), g.track(), positive(g.dir(), flipNow()), support.above());
              }

              /** Roof, pillars, lamps, benches, plus a station house (passenger) or a vault / tank yard (cargo / fluid). */
              private void decorate(Slot s) {
                  Direction side = s.side();
                  BlockState wall = Blocks.STONE_BRICK_WALL.defaultBlockState();
                  BlockState roof = Blocks.DEEPSLATE_TILE_SLAB.defaultBlockState();
                  BlockState lamp = Blocks.LANTERN.defaultBlockState().setValue(LanternBlock.HANGING, true);
                  BlockState bench = Blocks.SPRUCE_STAIRS.defaultBlockState().setValue(StairBlock.FACING, side.getOpposite());
                  for (int i = -FRONT; i <= BACK; i++)
                      for (int l = 3; l <= 6; l++) level.setBlock(at(s, i, l).above(5), roof, 2);
                  for (int i : new int[]{-6, 6, 18, 30, 42, 52})
                      for (int h = 1; h <= 4; h++) level.setBlock(at(s, i, 5).above(h), wall, 2);
                  for (int i : new int[]{0, 12, 24, 36, 48}) {
                      level.setBlock(at(s, i, 4).above(4), lamp, 2);
                      level.setBlock(at(s, i, 5).above(1), bench, 2);
                  }
                  if (s.kind() == Kind.PASSENGER) house(s, lamp);
                  else storage(s);
              }

              private void house(Slot s, BlockState lamp) {
                  for (int i = 14; i <= 28; i++)
                      for (int l = 6; l <= 9; l++) {
                          BlockPos g = at(s, i, l);
                          for (int h = 1; h <= 6; h++) clear(g.above(h));
                          level.setBlock(g, Blocks.POLISHED_ANDESITE.defaultBlockState(), 2);
                          foundation(g);
                          boolean edge = i == 14 || i == 28 || l == 6 || l == 9;
                          boolean door = l == 6 && i >= 20 && i <= 22;
                          for (int h = 1; h <= 3; h++) {
                              BlockState st = Blocks.AIR.defaultBlockState();
                              if (edge && !(door && h <= 2)) {
                                  boolean win = h == 2 && !door && (((l == 6 || l == 9) && (i - 14) % 4 == 2) || ((i == 14 || i == 28) && (l == 7 || l == 8)));
                                  st = (win ? Blocks.GLASS : Blocks.STONE_BRICKS).defaultBlockState();
                              }
                              level.setBlock(g.above(h), st, 2);
                          }
                          level.setBlock(g.above(4), Blocks.SPRUCE_SLAB.defaultBlockState(), 2);
                      }
                  level.setBlock(at(s, 21, 7).above(3), lamp, 2);
                  level.setBlock(at(s, 21, 8).above(3), lamp, 2);
              }

              /** Cargo stations get Create item vaults, fluid stations get Create fluid tanks. */
              private void storage(Slot s) {
                  boolean cargo = s.kind() == Kind.CARGO;
                  Block b = modBlock("create", cargo ? "item_vault" : "fluid_tank");
                  if (b == null) return;
                  for (int i = 2; i <= 50; i++)
                      for (int l = 6; l <= 9; l++) {
                          BlockPos g = at(s, i, l);
                          for (int h = 1; h <= 6; h++) clear(g.above(h));
                          level.setBlock(g, Blocks.POLISHED_ANDESITE.defaultBlockState(), 2);
                          foundation(g);
                      }
                  BlockState base = prop(b.defaultBlockState(), "horizontal_axis", s.dir().getAxis().getSerializedName());
                  int[] starts = cargo ? new int[]{4, 15, 26, 37} : new int[]{6, 16, 26, 36, 46};
                  int len = cargo ? 9 : 2, height = cargo ? 2 : 3;
                  List<BlockPos> placed = new ArrayList<>();
                  for (int st : starts)
                      for (int i = st; i < st + len; i++)
                          for (int l = 7; l <= 8; l++)
                              for (int h = 1; h <= height; h++) {
                                  BlockPos p = at(s, i, l).above(h);
                                  level.setBlock(p, base, 3);
                                  placed.add(p);
                              }
                  for (BlockPos p : placed) connect(p);
              }

              /** Asks the vault / tank to merge with its neighbours (what Create's own item does after placing). */
              private void connect(BlockPos p) {
                  BlockEntity e = level.getBlockEntity(p);
                  if (e == null) return;
                  for (Class<?> c = e.getClass(); c != null; c = c.getSuperclass()) {
                      try {
                          var m = c.getDeclaredMethod("updateConnectivity");
                          m.setAccessible(true);
                          m.invoke(e);
                          return;
                      } catch (NoSuchMethodException ignored) {
                      } catch (Throwable t) {
                          return;
                      }
                  }
              }

              /** Uses Create's own track-targeting item exactly like a player would (select track, then place the block). */
              private void target(ItemStack stack, BlockPos track, boolean positive, BlockPos at) {
                  stack.set(AllDataComponents.TRACK_TARGETING_ITEM_SELECTED_POS, track);
                  stack.set(AllDataComponents.TRACK_TARGETING_ITEM_SELECTED_DIRECTION, positive);
                  FakePlayer fp = FakePlayerFactory.getMinecraft(level);
                  fp.setPos(at.getX() + 0.5, at.getY(), at.getZ() + 0.5);
                  fp.setItemInHand(InteractionHand.MAIN_HAND, stack);
                  BlockPos floor = at.below();
                  BlockHitResult hit = new BlockHitResult(Vec3.atCenterOf(floor).add(0, 0.5, 0), Direction.UP, floor, false);
                  stack.useOn(new UseOnContext(level, fp, InteractionHand.MAIN_HAND, stack, hit));
              }
          }
          EOF

          echo "Project generated:"; find src -type f | sort

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Collect result (jar + log)
        if: always()
        run: |
          mkdir -p result
          cp build.log result/build.log 2>/dev/null || echo "no log" > result/build.log
          cp build/libs/*.jar result/ 2>/dev/null || echo "No jar produced (build failed) - see build.log" > result/NO_JAR.txt
          rm -f result/*-sources.jar
          ls -la result

      - name: Upload result zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railnuke-1.1.0-result
          path: result/*
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
