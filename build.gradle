plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

// Everything is defined inline on purpose (no gradle.properties dependency).
def modId = 'railnuke'
version = '1.1.0'
group = 'com.railnuke'

base {
    archivesName = modId
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate for 1.21 lives here
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        railnuke {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Create 6.x for NeoForge 1.21.1 (no 'slim' classifier: it is not published for this version, the main jar is)
    implementation("com.simibubi.create:create-1.21.1:6.0.11-346") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.+")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.+")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.+")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
